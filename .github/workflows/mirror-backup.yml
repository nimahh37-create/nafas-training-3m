name: مزامنة المستودع الاحتياطي

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-backup
  cancel-in-progress: true

jobs:
  mirror:
    # يعمل في المستودع الرسمي فقط
    if: github.repository == 'nimahh37-create/nafas-training-3m'
    runs-on: ubuntu-latest
    steps:
      - name: جلب المستودع الرسمي بكامل سجله
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: تجهيز مفتاح النشر
        env:
          SSH_KEY: ${{ secrets.BACKUP_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: تجهيز نسخة احتياطية من ملفات المنصة
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add backup git@github.com:nimahh37-create/nafas-sciences-platform.git
          git fetch backup main
          git checkout -B mirror backup/main
          git read-tree --reset -u "$GITHUB_SHA"
          # ملفات الأتمتة لا تُنسخ إلى الاحتياطي (GitHub يمنع تحديثها بمفتاح نشر)
          rm -rf .github
          git add -A
          if git diff --cached --quiet; then
            echo "لا توجد تغييرات جديدة في ملفات المنصة"
            exit 0
          fi
          git commit -m "مزامنة تلقائية من المستودع الرسمي — $GITHUB_SHA"

      - name: دفع النسخة الاحتياطية
        run: |
          git push backup mirror:main --force
